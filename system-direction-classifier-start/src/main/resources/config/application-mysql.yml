spring:
  datasource:
    url: ${CLASSIFIER_DB_URL}
    username: ${CLASSIFIER_DB_USER}
    password: ${CLASSIFIER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-users.yaml
  jackson:
    default-property-inclusion: always
server:
  address: 127.0.0.1
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
classifier:
  identity:
    bootstrap-login: ${CLASSIFIER_ADMIN_LOGIN:}
    bootstrap-password: ${CLASSIFIER_ADMIN_PASSWORD:}
management:
  server:
    address: 127.0.0.1
